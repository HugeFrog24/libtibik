name: Translation coverage

on:
  push:
    branches: [main]
    paths: ["strings/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Recompute coverage into README
        run: node scripts/coverage.mjs
      - name: Commit READMEs if they changed
        run: |
          if [ -z "$(git status --porcelain README*.md)" ]; then
            echo "Coverage unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md
          git commit -m "docs: refresh translation coverage [skip ci]"
          git push
