<svg xmlns="http://www.w3.org/2000/svg" width="167" height="28" viewBox="0 0 167 28" role="img" aria-label="Movido a autismo" xml:lang="pt-BR">
  <title>Movido a autismo</title>
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7e0a0" stop-opacity="0.8">
        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite"
                 keyTimes="0;0.2;0.4;0.6;0.8;1"
                 values="#f7e0a0;#f8cfa0;#f4b9aa;#efbfd0;#d6c6ee;#f7e0a0"/>
      </stop>
      <stop offset="1" stop-color="#f8cfa0" stop-opacity="0.8">
        <animate attributeName="stop-color" dur="15s" repeatCount="indefinite"
                 keyTimes="0;0.2;0.4;0.6;0.8;1"
                 values="#f8cfa0;#f4b9aa;#efbfd0;#d6c6ee;#f7e0a0;#f8cfa0"/>
      </stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="hfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f23864"/>
      <stop offset="1" stop-color="#c21848"/>
    </linearGradient>
    <linearGradient id="hgloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="hshadow" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#4d1837" flood-opacity="0.5"/>
    </filter>
    <path id="heart" d="M12 20.5C5 15.5 2.5 12 2.5 8.6C2.5 5.9 4.5 4 6.9 4C9.1 4 10.9 5.2 12 7.2C13.1 5.2 14.9 4 17.1 4C19.5 4 21.5 5.9 21.5 8.6C21.5 12 19 15.5 12 20.5Z"/>
    <clipPath id="hclip"><use href="#heart"/></clipPath>
    <clipPath id="round"><rect width="167" height="28" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="167" height="28" fill="url(#holo)"/>
    <path d="M0 0H167V12Q83.5 19 0 12Z" fill="url(#bgloss)"/>
    <path d="M0 21Q83.5 17 167 21V28H0Z" fill="url(#bglow)"/>
    <rect x="-60" y="0" width="50" height="28" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" from="-60" to="223" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="166" height="27" rx="13.5" fill="none" stroke="#8c91ad" stroke-opacity="0.45"/>

  <g transform="translate(12.6 7.3) scale(0.55)">
    <use href="#heart" fill="url(#hfill)" filter="url(#hshadow)"/>
    <g clip-path="url(#hclip)">
      <ellipse cx="12" cy="3.5" rx="11" ry="7.5" fill="url(#hgloss)"/>
      <ellipse cx="7.3" cy="7.3" rx="2.3" ry="1.3" fill="#fff" fill-opacity="0.8" transform="rotate(-35 7.3 7.3)"/>
    </g>
  </g>

  <g font-family="Verdana,DejaVu Sans,sans-serif" fill="#343857">
    <text x="31" y="17.7" font-size="10.5" font-weight="bold">MOVIDO A AUTISMO</text>
  </g>
</svg>
